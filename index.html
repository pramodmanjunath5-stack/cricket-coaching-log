<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaching Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#292321; --ink-soft:#6B615C;
    --ball:#C1272D; --ball-dark:#9C1F24;
    --willow:#E8A5A0; --willow-light:#FBEAE8;
    --paper:#FEFEFD; --paper-line:#EEEAE6;
    --card:#FFFFFF; --border:#E6E1DC;
    --good:#2E7D32; --good-light:#E8F5E9;
    --warn:#B5650A; --warn-light:#FDF1E2;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;padding:2rem 1.25rem 4rem;}
  .wrap{max-width:880px;margin:0 auto;}
  header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:1rem;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;}
  header h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;margin:0;letter-spacing:-0.01em;}
  header p{margin:0.25rem 0 0;color:var(--ink-soft);font-size:0.9rem;}
  .status-pill{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;padding:0.35rem 0.7rem;border-radius:20px;background:var(--willow-light);color:var(--ball-dark);border:1px solid var(--willow);white-space:nowrap;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;gap:0.75rem;flex-wrap:wrap;}
  .toolbar h2{font-family:'Fraunces',serif;font-size:1.2rem;margin:0;}
  .filter-row{display:flex;align-items:flex-end;gap:0.75rem;flex-wrap:wrap;margin-bottom:0.75rem;padding-bottom:1rem;border-bottom:1px solid var(--paper-line);}
  .filter-row .field{margin-bottom:0;}
  .filter-row label{font-size:0.72rem;color:var(--ink-soft);display:block;margin-bottom:0.2rem;}
  .filter-row input{padding:0.4rem 0.55rem;font-size:0.82rem;}
  .filter-presets{display:flex;gap:0.4rem;flex-wrap:wrap;}
  .filter-presets button.active{background:var(--willow-light);border-color:var(--ball);color:var(--ball);}
  .filter-note{font-size:0.8rem;color:var(--ink-soft);margin-bottom:0.9rem;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:0.88rem;padding:0.7rem 1.25rem;border:none;border-radius:7px;background:var(--ball);color:#fff;cursor:pointer;}
  button:hover{background:var(--ball-dark);}
  button:disabled{opacity:0.55;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--willow-light);border-color:var(--willow);}
  .btn-danger{background:transparent;color:var(--warn);border:1px solid #EFC9C9;}
  .btn-danger:hover{background:var(--warn-light);}
  .btn-sm{padding:0.5rem 0.85rem;font-size:0.82rem;}
  .btn-block{width:100%;margin-top:0.5rem;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:1rem;}
  .card h2,.card h3{font-family:'Fraunces',serif;font-weight:600;margin:0 0 1.1rem;}

  .students-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0.75rem;}
  .stu-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.9rem 1rem;}
  .stu-top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:0.4rem;}
  .stu-name{font-family:'Fraunces',serif;font-weight:600;font-size:1rem;}
  .stu-meta{color:var(--ink-soft);font-size:0.76rem;margin-top:0.1rem;}
  .pay-flag{display:inline-block;font-size:0.68rem;font-weight:600;padding:0.18rem 0.5rem;border-radius:99px;white-space:nowrap;}
  .flag-green{background:#E4F2EC;color:#1a7a4c;}
  .flag-amber{background:#FCF0DA;color:#a3690f;}
  .flag-red{background:#FBE7E6;color:#b3261e;}
  .flag-neutral{background:#EDEEF0;color:#5B6B82;}
  .stu-stats{display:flex;justify-content:space-between;align-items:baseline;margin-top:0.6rem;font-size:0.82rem;}
  .stu-stats b{font-family:'IBM Plex Mono',monospace;font-size:0.9rem;}
  .bar{height:6px;border-radius:5px;background:var(--paper-line);margin-top:0.4rem;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--willow),var(--ball));border-radius:5px;}
  .stu-actions{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.75rem;}
  .stu-actions button{flex:1 1 28%;padding:0.45rem 0.4rem;font-size:0.74rem;white-space:nowrap;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem 1.25rem;}
  .field{display:flex;flex-direction:column;gap:0.35rem;}
  .field.full{grid-column:1/-1;}
  label{font-size:0.76rem;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);}
  input,select,textarea{font-family:'Inter',sans-serif;font-size:0.95rem;padding:0.6rem 0.7rem;border:1px solid var(--border);border-radius:6px;background:var(--paper);color:var(--ink);width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ball);background:#fff;}
  textarea{resize:vertical;min-height:70px;}

  .msg{font-size:0.85rem;margin-top:0.75rem;padding:0.6rem 0.8rem;border-radius:6px;display:none;}
  .msg.show{display:block;}
  .msg.ok{background:var(--good-light);color:var(--good);}
  .msg.err{background:var(--warn-light);color:var(--warn);}

  table{width:100%;border-collapse:collapse;font-size:0.86rem;}
  thead th{text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);padding:0.5rem 0.5rem;border-bottom:2px solid var(--ink);}
  tbody td{padding:0.6rem 0.5rem;border-bottom:1px solid var(--paper-line);vertical-align:top;}
  tbody tr:hover{background:var(--willow-light);}
  .figs{font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .empty{text-align:center;color:var(--ink-soft);padding:2rem 1rem;font-size:0.9rem;}
  .chart-wrap{position:relative;height:210px;margin:0.5rem 0 1.25rem;}

  .modal-bg{position:fixed;inset:0;background:rgba(22,50,79,0.45);display:none;align-items:center;justify-content:center;padding:1rem;z-index:50;}
  .login-gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:100;}
  .login-gate.hidden{display:none;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:2rem;max-width:340px;width:100%;box-shadow:0 8px 30px rgba(22,50,79,0.12);}
  .login-card input{width:100%;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:12px;padding:1.75rem;max-width:420px;width:100%;}
  .modal h3{font-family:'Fraunces',serif;margin:0 0 1.1rem;}
  .modal .field{margin-bottom:1rem;}
  .radio-row{display:flex;gap:1.25rem;margin-top:0.3rem;}
  .radio-row label{display:flex;align-items:center;gap:0.4rem;text-transform:none;font-weight:500;font-size:0.9rem;color:var(--ink);}
  .radio-row input{width:auto;}
  .modal-actions{display:flex;gap:0.6rem;margin-top:1.4rem;}
  .modal-actions button{flex:1;}

  .back-link{background:none;border:none;color:var(--ball);font-weight:600;padding:0;margin-bottom:1rem;cursor:pointer;font-size:0.9rem;}
  .back-link:hover{background:none;text-decoration:underline;color:var(--ball-dark);}

  .link-box{display:flex;gap:0.5rem;align-items:center;background:var(--paper);border:1px solid var(--border);border-radius:6px;padding:0.5rem 0.7rem;font-size:0.8rem;font-family:'IBM Plex Mono',monospace;word-break:break-all;margin-top:0.5rem;}

  .fab{position:fixed;bottom:1.5rem;right:1.5rem;width:56px;height:56px;border-radius:50%;font-size:1.6rem;line-height:1;padding:0;box-shadow:0 4px 14px rgba(22,50,79,0.3);}
  .hidden{display:none !important;}
  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
    .students-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<div id="loginGate" class="login-gate">
  <div class="login-card">
    <h1 style="font-family:'Fraunces',serif;font-size:1.4rem;margin:0 0 0.3rem;">Coaching log</h1>
    <p style="color:var(--ink-soft);font-size:0.88rem;margin:0 0 1.5rem;">Enter the password to continue.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <div class="msg" id="loginMsg"></div>
      <button type="submit" id="loginBtn" style="width:100%;margin-top:0.75rem;">Log in</button>
      <button type="button" id="forgotPasswordBtn" class="btn-ghost btn-sm" style="width:100%;margin-top:0.6rem;">Forgot password?</button>
    </form>
  </div>
</div>

<div id="appRoot" class="hidden">
<div class="wrap">

  <header>
    <div>
      <h1>Coaching log</h1>
      <p>Students, sessions, and progress in one place</p>
    </div>
    <div style="display:flex;align-items:center;gap:0.6rem;">
      <span class="status-pill" id="statusPill">connecting…</span>
      <button type="button" class="btn-ghost btn-sm" id="logoutBtn">Log out</button>
    </div>
  </header>

  <!-- LANDING VIEW -->
  <div id="landingView">
    <div class="toolbar">
      <h2>Students</h2>
      <button type="button" class="btn-ghost btn-sm" id="exportAllBtn">Export all to Excel</button>
    </div>
    <div class="students-grid" id="studentsGrid"></div>
  </div>

  <!-- PROFILE VIEW -->
  <div id="profileView" class="hidden">
    <button class="back-link" id="backBtn">&larr; All students</button>

    <div class="card" id="profileHeaderCard"></div>

    <div class="card">
      <h3>Log a session</h3>
      <div class="filter-note" id="loggingContextNote"></div>
      <form id="entryForm">
        <div class="grid">
          <div class="field">
            <label for="sessionDate">Session date</label>
            <input type="date" id="sessionDate" required>
          </div>
          <div class="field" id="sessionsUsedField">
            <label for="sessionsUsed">Sessions used</label>
            <select id="sessionsUsed" required></select>
          </div>
          <div class="field" id="amountUsedField" style="display:none;">
            <label for="sessionAmountUsed">Amount used this session ($)</label>
            <input type="number" id="sessionAmountUsed" min="0" step="0.01" placeholder="0.00">
          </div>

          <div class="field full"><label for="finance">Finance</label><input type="text" id="finance" placeholder="e.g. Paid - $50 cash"></div>
          <div class="field full">
            <label for="sessionPaymentStatus">Payment (this session)</label>
            <select id="sessionPaymentStatus">
              <option value="Unpaid">Unpaid — last session</option>
              <option value="Paid">Paid — last session</option>
              <option value="Paid upfront" id="paidUpfrontOption">Paid upfront (already covered)</option>
              <option value="Not needed">Payment not needed</option>
            </select>
          </div>
          <div class="field full" id="sessionAmountField" style="display:none;">
            <label for="sessionAmountPaid">Amount paid ($)</label>
            <input type="number" id="sessionAmountPaid" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="field full"><label for="comments">Comments</label><textarea id="comments" placeholder="How the session went, what to work on next time"></textarea></div>
          <div class="field full"><label for="internalNote">Internal note (private — not shared with parents)</label><textarea id="internalNote" placeholder="Notes for yourself only"></textarea></div>
        </div>
        <button type="submit" id="submitBtn" style="margin-top:1.1rem;">Save session</button>
        <button type="button" id="cancelEditBtn" class="btn-ghost hidden" style="margin-top:1.1rem;margin-left:0.5rem;">Cancel edit</button>
        <div class="msg" id="formMsg"></div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <h3 style="margin:0;">Session history</h3>
        <button type="button" class="btn-ghost btn-sm" id="exportOneBtn">Export this student</button>
      </div>
      <div class="filter-row">
        <div class="field">
          <label for="filterFrom">From</label>
          <input type="date" id="filterFrom">
        </div>
        <div class="field">
          <label for="filterTo">To</label>
          <input type="date" id="filterTo">
        </div>
        <div class="filter-presets">
          <button type="button" class="btn-ghost btn-sm" data-preset="3m">Last 3 months</button>
          <button type="button" class="btn-ghost btn-sm" data-preset="6m">Last 6 months</button>
          <button type="button" class="btn-ghost btn-sm" data-preset="all">Overall</button>
          <button type="button" class="btn-ghost btn-sm" id="clearFilterBtn">Clear</button>
        </div>
      </div>
      <div class="filter-note" id="filterNote"></div>
      <div id="tableWrap"></div>
    </div>
  </div>

  <button type="button" class="fab" id="addFab" title="Add student">+</button>
</div>
</div>
<!-- /appRoot -->

<!-- ADD/EDIT STUDENT MODAL -->
<div class="modal-bg" id="studentModalBg">
  <div class="modal">
    <h3 id="modalTitle">Add student</h3>
    <form id="studentForm">
      <input type="hidden" id="editingId">
      <input type="hidden" id="enrollmentEditId">
      <input type="hidden" id="modalMode" value="add">
      <div class="field" id="stuNameField">
        <label for="stuName">Student name</label>
        <input type="text" id="stuName" required>
      </div>
      <div class="field">
        <label>Enrollment</label>
        <div class="radio-row">
          <label><input type="radio" name="enrollType" value="Individual" checked> Individual sessions</label>
          <label><input type="radio" name="enrollType" value="Package"> Package (sessions)</label>
          <label><input type="radio" name="enrollType" value="PackageMoney"> Package (money)</label>
        </div>
      </div>
      <div class="field">
        <label for="enrollStartDate">Start date (optional)</label>
        <input type="date" id="enrollStartDate">
        <div style="font-size:0.72rem;color:var(--ink-soft);margin-top:0.25rem;">Leave blank to use the date of the first session logged.</div>
      </div>
      <div class="field" id="packageSizeField" style="display:none;">
        <label for="packageSize">Package size (sessions)</label>
        <select id="packageSize"></select>
      </div>
      <div class="field" id="totalAmountField" style="display:none;">
        <label for="totalAmount">Total package amount ($)</label>
        <input type="number" id="totalAmount" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="field" id="amountPaidField" style="display:none;">
        <label for="amountPaid">Amount paid so far ($)</label>
        <input type="number" id="amountPaid" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="msg" id="studentMsg"></div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelStudentBtn">Cancel</button>
        <button type="submit" id="saveStudentBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxR075kUlqeEygo4SE4Oo74JEz1XpiRyrCsDRwMZjRMvSTGUmcjC3l7LTxxkB4kYyzvXA/exec";
// Must match ADMIN_KEY in the Apps Script backend. Keeps InternalNote out of
// what the parent-facing view.html receives.
const ADMIN_KEY = "aba47f4c2ebf20567ae4de63";
const VIEWER_BASE = window.location.href.replace(/index\.html$/,'').replace(/\/?$/,'/') + "view.html";

// ---- login gate ----
const loginGate = document.getElementById('loginGate');
const appRoot = document.getElementById('appRoot');
const loginForm = document.getElementById('loginForm');
const loginMsg = document.getElementById('loginMsg');

function showApp(){
  loginGate.classList.add('hidden');
  appRoot.classList.remove('hidden');
  loadAll();
}

if(localStorage.getItem('coachLoggedIn') === 'true'){
  showApp();
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Checking…';
  loginMsg.className = 'msg';
  try{
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', password: document.getElementById('loginPassword').value })
    });
    const result = await res.json();
    if(result.status === 'success'){
      localStorage.setItem('coachLoggedIn', 'true');
      showApp();
    }else{
      loginMsg.textContent = 'Incorrect password.';
      loginMsg.className = 'msg show err';
    }
  }catch(err){
    loginMsg.textContent = 'Could not check password. Try again.';
    loginMsg.className = 'msg show err';
  }finally{
    btn.disabled = false; btn.textContent = 'Log in';
  }
});

document.getElementById('forgotPasswordBtn').addEventListener('click', async () => {
  const btn = document.getElementById('forgotPasswordBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  loginMsg.className = 'msg';
  try{
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'forgotPassword' })
    });
    const result = await res.json();
    if(result.status === 'success'){
      loginMsg.textContent = 'Password sent to your email.';
      loginMsg.className = 'msg show ok';
    }else{
      loginMsg.textContent = 'Could not send email. Try again.';
      loginMsg.className = 'msg show err';
    }
  }catch(err){
    loginMsg.textContent = 'Could not send email. Try again.';
    loginMsg.className = 'msg show err';
  }finally{
    btn.disabled = false; btn.textContent = 'Forgot password?';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('coachLoggedIn');
  location.reload();
});

const statusPill = document.getElementById('statusPill');
const studentsGrid = document.getElementById('studentsGrid');
const landingView = document.getElementById('landingView');
const profileView = document.getElementById('profileView');
const profileHeaderCard = document.getElementById('profileHeaderCard');
const tableWrap = document.getElementById('tableWrap');
const filterNote = document.getElementById('filterNote');
const formMsg = document.getElementById('formMsg');
const studentMsg = document.getElementById('studentMsg');

let students = [];
let log = [];
let activeStudent = null;
let editingSessionId = null;

// build sessions-used dropdown options (0.5 to 15)
function buildHalfSteps(selectEl, max, placeholder){
  selectEl.innerHTML = (placeholder ? `<option value="">${placeholder}</option>` : '');
  for(let v=0.5; v<=max; v+=0.5){
    const label = Number.isInteger(v) ? v.toFixed(0) : v.toFixed(1);
    selectEl.innerHTML += `<option value="${v}">${label}</option>`;
  }
}
function buildWholeSteps(selectEl, max){
  selectEl.innerHTML = '<option value="N/A">N/A (no fixed number)</option>';
  for(let v=1; v<=max; v++){
    selectEl.innerHTML += `<option value="${v}">${v}</option>`;
  }
}

buildHalfSteps(document.getElementById('sessionsUsed'), 15);
buildWholeSteps(document.getElementById('packageSize'), 15);
document.getElementById('sessionDate').value = todayMelbourne();

function showMsg(el, text, ok){
  el.textContent = text;
  el.className = 'msg show ' + (ok ? 'ok' : 'err');
  setTimeout(()=>{ el.className = 'msg'; }, 4000);
}
function fmtDate(v){
  if(!v) return '—';
  const d = new Date(v);
  if(isNaN(d)) return v;
  return d.toLocaleDateString('en-AU', {day:'2-digit', month:'short', year:'numeric', timeZone:'Australia/Melbourne'});
}

// Today's date in Melbourne, as yyyy-mm-dd — independent of the viewer's own device timezone
function todayMelbourne(){
  return new Date().toLocaleDateString('en-CA', {timeZone:'Australia/Melbourne'});
}

// Returns {cls, label} for a student's payment flag.
// Package students: driven by their profile-level PaymentStatus.
// Individual students: driven by the payment status logged on their most recent session.
function paymentFlagFor(s){
  const isPkg = s.EnrollmentType === 'Package' || s.EnrollmentType === 'PackageMoney';
  if(isPkg){
    const status = s.PaymentStatus || 'Not paid';
    if(status === 'Paid in full') return {cls:'flag-green', label:'Paid in full'};
    if(status === 'Partially paid') return {cls:'flag-amber', label:'Partially paid'};
    return {cls:'flag-red', label:'Not paid'};
  }
  const rows = log.filter(l => l.EnrollmentID === s.CurrentEnrollmentID)
    .sort((a,b) => new Date(b.SessionDate) - new Date(a.SessionDate));
  if(rows.length === 0) return null;
  const latest = rows[0];
  return latest.SessionPaymentStatus === 'Paid'
    ? {cls:'flag-green', label:'Paid — last session'}
    : {cls:'flag-red', label:'Unpaid — last session'};
}

document.getElementById('sessionPaymentStatus').addEventListener('change', (e) => {
  document.getElementById('sessionAmountField').style.display = e.target.value === 'Paid' ? 'block' : 'none';
});

async function loadAll(){
  try{
    const res = await fetch(SCRIPT_URL + "?key=" + ADMIN_KEY);
    const data = await res.json();
    students = data.students || [];
    log = data.log || [];
    statusPill.textContent = 'connected · ' + students.length + ' students';
    renderLanding();
    if(activeStudent){
      const fresh = students.find(s => s.StudentID === activeStudent.StudentID);
      if(fresh){ activeStudent = fresh; renderProfile(); }
    }
  }catch(err){
    statusPill.textContent = 'connection failed';
    studentsGrid.innerHTML = '<div class="empty">Could not load data. Check your connection.</div>';
  }
}

function renderLanding(){
  if(students.length === 0){
    studentsGrid.innerHTML = '<div class="empty">No students yet — tap + to add your first one.</div>';
    return;
  }
  studentsGrid.innerHTML = students.map(s => {
    const isPkg = s.EnrollmentType === 'Package' && s.PackageSize && s.PackageSize !== 'N/A';
    const isFlexPkg = s.EnrollmentType === 'Package' && (!s.PackageSize || s.PackageSize === 'N/A');
    const isMoneyPkg = s.EnrollmentType === 'PackageMoney';
    const used = Number(s.SessionsUsed) || 0;
    const total = isPkg ? Number(s.PackageSize) : null;
    const pct = isPkg ? Math.min(100, (used/total)*100) : 0;
    const amountUsed = Number(s.AmountUsedTotal) || 0;
    const moneyTotal = isMoneyPkg ? Number(s.TotalAmount) || 0 : null;
    const moneyPct = isMoneyPkg && moneyTotal > 0 ? Math.min(100, (amountUsed/moneyTotal)*100) : 0;
    const flag = paymentFlagFor(s);
    return `
      <div class="stu-card">
        <div class="stu-top">
          <div class="stu-name">${s.StudentName}</div>
          ${flag ? `<span class="pay-flag ${flag.cls}">${flag.label}</span>` : ''}
        </div>
        <div class="stu-meta">${isPkg ? 'Package of ' + total + ' sessions' : isFlexPkg ? 'Package (flexible size)' : isMoneyPkg ? 'Package of $' + moneyTotal : 'Individual sessions'} · Last: ${fmtDate(s.LastSession)}</div>
        ${isPkg ? `
          <div class="stu-stats"><span>Sessions</span><b>${used}/${total}</b></div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
        ` : isMoneyPkg ? `
          <div class="stu-stats"><span>Sessions done</span><b>${used}</b></div>
          <div class="bar" style="margin-top:0.3rem;"><div class="bar-fill" style="width:${moneyPct}%"></div></div>
          <div class="stu-stats" style="margin-top:0.3rem;"><span>Amount used</span><b>$${amountUsed}/$${moneyTotal}</b></div>
        ` : `
          <div class="stu-stats"><span>Sessions logged</span><b>${used}</b></div>
        `}
        <div class="stu-actions">
          <button type="button" class="btn-sm open-profile" data-id="${s.StudentID}" title="Open profile">Open</button>
          <button type="button" class="btn-ghost btn-sm copy-link" data-code="${s.ShareCode}" title="Copy parent link">Copy</button>
          <button type="button" class="btn-ghost btn-sm edit-student" data-id="${s.StudentID}" title="Edit student">Edit</button>
          <button type="button" class="btn-ghost btn-sm new-enrollment" data-id="${s.StudentID}" title="Start new package or individual sessions">New</button>
          <button type="button" class="btn-danger btn-sm delete-student" data-id="${s.StudentID}" title="Delete student">Del</button>
        </div>
      </div>
    `;
  }).join('');

  studentsGrid.querySelectorAll('.open-profile').forEach(b => b.addEventListener('click', () => openProfile(b.dataset.id)));
  studentsGrid.querySelectorAll('.copy-link').forEach(b => b.addEventListener('click', () => copyLink(b.dataset.code, b)));
  studentsGrid.querySelectorAll('.edit-student').forEach(b => b.addEventListener('click', () => openStudentModal(b.dataset.id)));
  studentsGrid.querySelectorAll('.new-enrollment').forEach(b => b.addEventListener('click', () => {
    const s = students.find(x => x.StudentID === b.dataset.id);
    if(s) openNewEnrollmentModal(s);
  }));
  studentsGrid.querySelectorAll('.delete-student').forEach(b => b.addEventListener('click', () => deleteStudent(b.dataset.id)));
}

function copyLink(code, btn){
  const url = VIEWER_BASE + "?code=" + code;
  navigator.clipboard.writeText(url).then(() => {
    const old = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=> btn.textContent = old, 1500);
  }).catch(() => {
    prompt('Copy this link:', url);
  });
}

function openProfile(id){
  activeStudent = students.find(s => s.StudentID === id);
  if(!activeStudent) return;
  landingView.classList.add('hidden');
  profileView.classList.remove('hidden');
  document.getElementById('sessionAmountField').style.display = document.getElementById('sessionPaymentStatus').value === 'Paid' ? 'block' : 'none';
  filterFrom = ''; filterTo = '';
  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value = '';
  document.querySelectorAll('.filter-presets button[data-preset]').forEach(b => b.classList.remove('active'));
  selectedEnrollmentId = activeStudent.CurrentEnrollmentID;
  renderProfile();
}
document.getElementById('backBtn').addEventListener('click', () => {
  profileView.classList.add('hidden');
  landingView.classList.remove('hidden');
  activeStudent = null;
});

// which enrollment's stats/sessions are currently shown on the profile page
let selectedEnrollmentId = null;

function renderProfile(){
  const s = activeStudent;
  if(!selectedEnrollmentId){
    selectedEnrollmentId = s.CurrentEnrollmentID;
  }
  const enr = (s.Enrollments || []).find(e => e.EnrollmentID === selectedEnrollmentId) || s.Enrollments?.[0];
  if(!enr){
    profileHeaderCard.innerHTML = `<div class="stu-name" style="font-size:1.4rem;">${s.StudentName}</div><p style="color:var(--ink-soft);">No enrollment on record.</p>`;
    return;
  }

  const isPkg = enr.EnrollmentType === 'Package' && enr.PackageSize && enr.PackageSize !== 'N/A';
  const isFlexPkg = enr.EnrollmentType === 'Package' && (!enr.PackageSize || enr.PackageSize === 'N/A');
  const isMoneyPkg = enr.EnrollmentType === 'PackageMoney';
  const isAnyPkg = enr.EnrollmentType === 'Package' || isMoneyPkg;
  const used = Number(enr.SessionsUsed) || 0;
  const total = isPkg ? Number(enr.PackageSize) : null;
  const pct = isPkg ? Math.min(100, (used/total)*100) : 0;
  const amountUsed = Number(enr.AmountUsedTotal) || 0;
  const moneyTotal = isMoneyPkg ? Number(enr.TotalAmount) || 0 : null;
  const moneyPct = isMoneyPkg && moneyTotal > 0 ? Math.min(100, (amountUsed/moneyTotal)*100) : 0;
  const isCurrent = enr.EnrollmentID === s.CurrentEnrollmentID;
  const url = VIEWER_BASE + "?code=" + s.ShareCode;
  const flag = isCurrent ? paymentFlagFor(s) : enrollmentFlag(enr);

  const paidUpfrontOpt = document.getElementById('paidUpfrontOption');
  paidUpfrontOpt.hidden = !isAnyPkg;
  const paymentSelect = document.getElementById('sessionPaymentStatus');
  if(!isAnyPkg && paymentSelect.value === 'Paid upfront'){
    paymentSelect.value = 'Unpaid';
  }
  document.getElementById('sessionsUsedField').style.display = 'block';
  document.getElementById('sessionsUsed').required = !isMoneyPkg;
  document.querySelector('#sessionsUsedField label').textContent = isMoneyPkg ? 'Sessions done this visit (optional)' : 'Sessions used';
  document.getElementById('amountUsedField').style.display = isMoneyPkg ? 'block' : 'none';

  const enrollOptions = (s.Enrollments || []).map(e => {
    const label = (e.EnrollmentType === 'Package' ? (e.PackageSize && e.PackageSize !== 'N/A' ? 'Package of ' + e.PackageSize + ' sessions' : 'Package (flexible size)')
      : e.EnrollmentType === 'PackageMoney' ? 'Package of $' + e.TotalAmount
      : 'Individual sessions')
      + ' — started ' + fmtDate(e.StartDate) + (e.EnrollmentID === s.CurrentEnrollmentID ? ' (current)' : '');
    return `<option value="${e.EnrollmentID}" ${e.EnrollmentID === selectedEnrollmentId ? 'selected' : ''}>${label}</option>`;
  }).join('');

  const allEnr = s.Enrollments || [];
  const oldestFirst = [...allEnr].reverse();
  const typeAsc = oldestFirst.filter(e => e.EnrollmentType === enr.EnrollmentType);
  const ordinal = typeAsc.findIndex(e => e.EnrollmentID === enr.EnrollmentID) + 1;
  const completedPackages = allEnr.filter(e => (e.EnrollmentType === 'Package' || e.EnrollmentType === 'PackageMoney') && e.EnrollmentID !== s.CurrentEnrollmentID).length;
  const completedIndividual = allEnr.filter(e => e.EnrollmentType === 'Individual' && e.EnrollmentID !== s.CurrentEnrollmentID).length;
  const currentTypeLabel = isPkg ? 'package' : isMoneyPkg ? 'money package' : 'individual sessions';
  const historyLine = allEnr.length > 1
    ? `History: ${completedPackages} completed package${completedPackages === 1 ? '' : 's'} · ${completedIndividual} individual-session cycle${completedIndividual === 1 ? '' : 's'}` +
      (isCurrent ? ` — currently on ${currentTypeLabel} #${ordinal}.` : ` (viewing ${currentTypeLabel} #${ordinal}).`)
    : '';

  profileHeaderCard.innerHTML = `
    <div class="stu-top">
      <div class="stu-name" style="font-size:1.4rem;">${s.StudentName}</div>
      ${flag ? `<span class="pay-flag ${flag.cls}">${flag.label}</span>` : ''}
    </div>
    ${historyLine ? `<div class="stu-meta" style="margin-top:0.4rem;">${historyLine}</div>` : ''}
    ${(s.Enrollments || []).length > 1 ? `
      <div class="field" style="margin-top:0.75rem;max-width:340px;">
        <label for="enrollmentSelect">Viewing enrollment</label>
        <select id="enrollmentSelect">${enrollOptions}</select>
      </div>
    ` : ''}
    <div class="stu-meta" style="margin-top:0.6rem;">${isPkg ? 'Package of ' + total + ' sessions' : isFlexPkg ? 'Package (flexible size)' : isMoneyPkg ? 'Package of $' + (enr.TotalAmount || 0) : 'Individual sessions'} · Last session: ${fmtDate(enr.LastSession)}</div>
    ${isPkg ? `
      <div class="stu-stats"><span>Sessions attended</span><b>${used}/${total} <span style="font-weight:400;color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:0.85rem;">(${Math.max(0,total-used)} to go)</span></b></div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      ${enr.TotalAmount ? `<div class="stu-stats" style="margin-top:0.4rem;"><span>Amount paid</span><b>$${enr.AmountPaidTotal || 0} / $${enr.TotalAmount}</b></div>` : ''}
    ` : isMoneyPkg ? `
      <div class="stu-stats"><span>Sessions done</span><b>${used}</b></div>
      <div class="bar" style="margin-top:0.4rem;"><div class="bar-fill" style="width:${moneyPct}%"></div></div>
      <div class="stu-stats" style="margin-top:0.4rem;"><span>Amount used</span><b>$${amountUsed} / $${moneyTotal} <span style="font-weight:400;color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:0.85rem;">($${Math.max(0,moneyTotal-amountUsed)} remaining)</span></b></div>
    ` : isFlexPkg ? `
      <div class="stu-stats"><span>Sessions logged</span><b>${used}</b></div>
      ${enr.TotalAmount ? `<div class="stu-stats" style="margin-top:0.4rem;"><span>Amount paid</span><b>$${enr.AmountPaidTotal || 0} / $${enr.TotalAmount}</b></div>` : ''}
    ` : `<div class="stu-stats"><span>Sessions logged</span><b>${used}</b></div>`}
    <label style="display:block;margin-top:1rem;">Parent view link (read-only)</label>
    <div class="link-box">${url}</div>
    <div style="display:flex;gap:0.5rem;margin-top:0.6rem;flex-wrap:wrap;">
      <button type="button" class="btn-ghost btn-sm" id="copyProfileLink">Copy link</button>
    </div>
  `;
  document.getElementById('copyProfileLink').addEventListener('click', (e) => copyLink(s.ShareCode, e.target));
  const loggingNote = document.getElementById('loggingContextNote');
  loggingNote.textContent = isCurrent ? '' : 'You are viewing a past enrollment — sessions logged here will be added to this enrollment, not the current one.';
  loggingNote.style.color = isCurrent ? '' : 'var(--warn)';
  const sel = document.getElementById('enrollmentSelect');
  if(sel){
    sel.addEventListener('change', () => {
      selectedEnrollmentId = sel.value;
      renderProfile();
    });
  }

  renderSessionTable();
}

// Payment flag for a specific (possibly non-current) enrollment — used when viewing history
function enrollmentFlag(enr){
  if(enr.EnrollmentType === 'Package' || enr.EnrollmentType === 'PackageMoney'){
    const status = enr.PaymentStatus || 'Not paid';
    if(status === 'Paid in full') return {cls:'flag-green', label:'Paid in full'};
    if(status === 'Partially paid') return {cls:'flag-amber', label:'Partially paid'};
    return {cls:'flag-red', label:'Not paid'};
  }
  const rows = log.filter(l => l.EnrollmentID === enr.EnrollmentID)
    .sort((a,b) => new Date(b.SessionDate) - new Date(a.SessionDate));
  if(rows.length === 0) return null;
  return rows[0].SessionPaymentStatus === 'Paid'
    ? {cls:'flag-green', label:'Paid — last session'}
    : {cls:'flag-red', label:'Unpaid — last session'};
}

// filter state for the session history table — reset whenever a new profile is opened
let filterFrom = '';
let filterTo = '';

function sessionRowsTableHtml(rows, enrollmentById){
  return `
    <table>
      <thead><tr><th>Date</th><th>Used</th><th>Finance</th><th>Payment</th><th>Comments</th><th>Internal note</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => {
          const isUpfront = r.SessionPaymentStatus === 'Paid upfront';
          const enr = enrollmentById ? enrollmentById[r.EnrollmentID] : null;
          const amount = isUpfront ? (enr ? enr.AmountPaid : '') : r.SessionAmountPaid;
          const usedCell = (enr && enr.EnrollmentType === 'PackageMoney')
            ? (r.SessionAmountUsed ? '$' + r.SessionAmountUsed : '-')
            : (r.SessionsUsed ?? '-');
          return `
          <tr>
            <td>${fmtDate(r.SessionDate)}</td>
            <td class="figs">${usedCell}</td>
            <td>${r.Finance || ''}</td>
            <td><span class="pay-flag ${r.SessionPaymentStatus === 'Paid' ? 'flag-green' : (r.SessionPaymentStatus === 'Not needed' || r.SessionPaymentStatus === 'Paid upfront') ? 'flag-neutral' : 'flag-red'}">${r.SessionPaymentStatus || 'Unpaid'}</span>${amount ? ' $' + amount : ''}</td>
            <td>${r.Comments || ''}</td>
            <td style="color:var(--warn);">${r.InternalNote || ''}</td>
            <td style="white-space:nowrap;">
              <button type="button" class="btn-ghost btn-sm edit-session" data-id="${r.SessionID}">Edit</button>
              <button type="button" class="btn-danger btn-sm delete-session" data-id="${r.SessionID}" style="margin-left:0.35rem;">Del</button>
            </td>
          </tr>
        `;}).join('')}
      </tbody>
    </table>
  `;
}

function enrollmentLabel(e, s){
  return (e.EnrollmentType === 'Package' ? (e.PackageSize && e.PackageSize !== 'N/A' ? 'Package of ' + e.PackageSize + ' sessions' : 'Package (flexible size)')
    : e.EnrollmentType === 'PackageMoney' ? 'Package of $' + e.TotalAmount
    : 'Individual sessions')
    + ' — started ' + fmtDate(e.StartDate) + (e.EnrollmentID === s.CurrentEnrollmentID ? ' (current)' : '');
}

function dateOnly(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return String(v).slice(0,10);
  return d.toLocaleDateString('en-CA', {timeZone:'Australia/Melbourne'});
}

function renderSessionTable(){
  const s = activeStudent;

  if(filterFrom || filterTo){
    // date range active: show every enrollment's sessions in range, grouped by enrollment
    const enrollmentIds = (s.Enrollments || []).map(e => e.EnrollmentID);
    const rows = log.filter(l => enrollmentIds.includes(l.EnrollmentID)).filter(r => {
      const d = dateOnly(r.SessionDate);
      if(!d) return false;
      if(filterFrom && d < filterFrom) return false;
      if(filterTo && d > filterTo) return false;
      return true;
    });
    const fromLabel = filterFrom ? fmtDate(filterFrom) : 'the start';
    const toLabel = filterTo ? fmtDate(filterTo) : 'today';
    filterNote.textContent = `Showing sessions from ${fromLabel} to ${toLabel} across all packages/enrollments — ${rows.length} session${rows.length === 1 ? '' : 's'}.`;

    if(rows.length === 0){
      tableWrap.innerHTML = '<div class="empty">No sessions in that date range.</div>';
      return;
    }

    const byEnrollment = {};
    rows.forEach(r => {
      (byEnrollment[r.EnrollmentID] = byEnrollment[r.EnrollmentID] || []).push(r);
    });
    // oldest enrollment first, so it reads Package 1, Package 2, ... in order
    const orderedEnrollments = [...(s.Enrollments || [])].reverse().filter(e => byEnrollment[e.EnrollmentID]);
    const enrollmentById = {};
    (s.Enrollments || []).forEach(e => { enrollmentById[e.EnrollmentID] = e; });

    tableWrap.innerHTML = orderedEnrollments.map(e => {
      const sessRows = byEnrollment[e.EnrollmentID].sort((a,b) => new Date(a.SessionDate) - new Date(b.SessionDate));
      return `<h4 style="margin:1.25rem 0 0.5rem;font-family:'Fraunces',serif;font-size:1rem;">${enrollmentLabel(e, s)}</h4>` + sessionRowsTableHtml(sessRows, enrollmentById);
    }).join('');
    tableWrap.querySelectorAll('.edit-session').forEach(b => b.addEventListener('click', () => startEditSession(b.dataset.id)));
    tableWrap.querySelectorAll('.delete-session').forEach(b => b.addEventListener('click', () => deleteSession(b.dataset.id)));
    return;
  }

  // default view: latest 10 sessions of whichever enrollment is selected (defaults to current)
  const allRows = log.filter(l => l.EnrollmentID === selectedEnrollmentId)
    .sort((a,b) => new Date(b.SessionDate) - new Date(a.SessionDate));

  const rows = allRows.slice(0, 10);
  filterNote.textContent = allRows.length > 10
    ? `Displaying latest 10 sessions — choose a date range above to see this student's full history across all packages.`
    : '';

  if(allRows.length === 0){
    tableWrap.innerHTML = '<div class="empty">No sessions logged yet for this student.</div>';
    return;
  }

  tableWrap.innerHTML = sessionRowsTableHtml(rows, {[selectedEnrollmentId]: (s.Enrollments || []).find(e => e.EnrollmentID === selectedEnrollmentId)});
  tableWrap.querySelectorAll('.edit-session').forEach(b => b.addEventListener('click', () => startEditSession(b.dataset.id)));
    tableWrap.querySelectorAll('.delete-session').forEach(b => b.addEventListener('click', () => deleteSession(b.dataset.id)));
}

function setPresetRange(preset){
  document.querySelectorAll('.filter-presets button[data-preset]').forEach(b => b.classList.toggle('active', b.dataset.preset === preset));
  const today = new Date();
  const toStr = dateOnly(today);
  if(preset === 'all'){
    filterFrom = ''; filterTo = '';
    document.getElementById('filterFrom').value = '';
    document.getElementById('filterTo').value = '';
  }else{
    const months = preset === '3m' ? 3 : 6;
    const from = new Date(today);
    from.setMonth(from.getMonth() - months);
    filterFrom = dateOnly(from);
    filterTo = toStr;
    document.getElementById('filterFrom').value = filterFrom;
    document.getElementById('filterTo').value = filterTo;
  }
  renderSessionTable();
}

document.querySelectorAll('.filter-presets button[data-preset]').forEach(b => {
  b.addEventListener('click', () => setPresetRange(b.dataset.preset));
});
document.getElementById('clearFilterBtn').addEventListener('click', () => {
  filterFrom = ''; filterTo = '';
  document.getElementById('filterFrom').value = '';
  document.getElementById('filterTo').value = '';
  document.querySelectorAll('.filter-presets button[data-preset]').forEach(b => b.classList.remove('active'));
  renderSessionTable();
});
['filterFrom','filterTo'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    filterFrom = document.getElementById('filterFrom').value;
    filterTo = document.getElementById('filterTo').value;
    document.querySelectorAll('.filter-presets button[data-preset]').forEach(b => b.classList.remove('active'));
    renderSessionTable();
  });
});

// log / edit session
async function deleteSession(sessionId){
  if(!confirm('Delete this session? This cannot be undone.')) return;
  try{
    await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'deleteSession', sessionId }) });
    if(editingSessionId === sessionId){ cancelEditSession(); }
    await loadAll();
  }catch(err){
    alert('Could not delete. Try again.');
  }
}

function startEditSession(sessionId){
  const r = log.find(l => String(l.SessionID) === String(sessionId));
  if(!r) return;
  editingSessionId = sessionId;
  document.getElementById('sessionDate').value = r.SessionDate ? dateOnly(r.SessionDate) : '';
  document.getElementById('sessionsUsed').value = r.SessionsUsed ?? '';
  document.getElementById('sessionAmountUsed').value = r.SessionAmountUsed || '';
  document.getElementById('finance').value = r.Finance || '';
  document.getElementById('comments').value = r.Comments || '';
  document.getElementById('internalNote').value = r.InternalNote || '';
  document.getElementById('sessionPaymentStatus').value = r.SessionPaymentStatus || 'Unpaid';
  document.getElementById('sessionAmountPaid').value = r.SessionAmountPaid || '';
  document.getElementById('sessionAmountField').style.display = (r.SessionPaymentStatus === 'Paid') ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = 'Update session';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  document.getElementById('entryForm').scrollIntoView({behavior:'smooth', block:'start'});
}

function cancelEditSession(){
  editingSessionId = null;
  document.getElementById('entryForm').reset();
  document.getElementById('sessionDate').value = todayMelbourne();
  document.getElementById('submitBtn').textContent = 'Save session';
  document.getElementById('cancelEditBtn').classList.add('hidden');
  document.getElementById('sessionAmountField').style.display = 'none';
}
document.getElementById('cancelEditBtn').addEventListener('click', cancelEditSession);

document.getElementById('entryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const isEdit = !!editingSessionId;
  const enr = (activeStudent.Enrollments || []).find(x => x.EnrollmentID === selectedEnrollmentId);

  if(enr && enr.EnrollmentType === 'Package' && Number(enr.PackageSize) > 0){
    const enteredUsed = Number(document.getElementById('sessionsUsed').value) || 0;
    const editingOwnUsed = isEdit ? (Number((log.find(l => l.SessionID === editingSessionId) || {}).SessionsUsed) || 0) : 0;
    const baseline = (Number(enr.SessionsUsed) || 0) - editingOwnUsed;
    const projected = baseline + enteredUsed;
    const total = Number(enr.PackageSize);
    if(projected > total){
      const proceed = confirm(
        `This would put ${activeStudent.StudentName} at ${projected}/${total} sessions — over the package total.\n\n` +
        `Click Cancel to fix the number, or start a new package/individual sessions instead from the dashboard.\n` +
        `Click OK to log it anyway.`
      );
      if(!proceed) return;
    }
  }

  if(enr && enr.EnrollmentType === 'PackageMoney' && Number(enr.TotalAmount) > 0){
    const enteredAmount = Number(document.getElementById('sessionAmountUsed').value) || 0;
    const editingOwnAmount = isEdit ? (Number((log.find(l => l.SessionID === editingSessionId) || {}).SessionAmountUsed) || 0) : 0;
    const baseline = (Number(enr.AmountUsedTotal) || 0) - editingOwnAmount;
    const projected = baseline + enteredAmount;
    const total = Number(enr.TotalAmount);
    if(projected > total){
      const proceed = confirm(
        `This would put ${activeStudent.StudentName} at $${projected}/$${total} used — over the package total.\n\n` +
        `Click Cancel to fix the amount, or start a new package/individual sessions instead from the dashboard.\n` +
        `Click OK to log it anyway.`
      );
      if(!proceed) return;
    }
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = isEdit ? 'Updating…' : 'Saving…';
  const payload = {
    action: isEdit ? 'editSession' : 'addSession',
    sessionId: editingSessionId,
    studentName: activeStudent.StudentName,
    enrollmentId: selectedEnrollmentId,
    sessionDate: document.getElementById('sessionDate').value,
    sessionsUsed: document.getElementById('sessionsUsed').value,
    sessionAmountUsed: document.getElementById('sessionAmountUsed').value || 0,
    finance: document.getElementById('finance').value.trim(),
    comments: document.getElementById('comments').value.trim(),
    internalNote: document.getElementById('internalNote').value.trim(),
    sessionPaymentStatus: document.getElementById('sessionPaymentStatus').value,
    sessionAmountPaid: document.getElementById('sessionAmountPaid').value || 0
  };
  try{
    const res = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(payload) });
    const result = await res.json();
    const msg = isEdit ? 'Session updated.' : (result.overwritten ? 'Session for this date already existed — updated it instead of adding a duplicate.' : 'Session saved.');
    showMsg(formMsg, msg, true);
    editingSessionId = null;
    e.target.reset();
    document.getElementById('sessionDate').value = todayMelbourne();
    document.getElementById('cancelEditBtn').classList.add('hidden');
    document.getElementById('sessionAmountField').style.display = 'none';
    await loadAll();
  }catch(err){
    showMsg(formMsg, 'Could not save. Try again.', false);
  }finally{
    btn.disabled = false; btn.textContent = editingSessionId ? 'Update session' : 'Save session';
  }
});

// add/edit student modal — also doubles as the "start new enrollment" modal

const studentForm = document.getElementById('studentForm');
const modalTitle = document.getElementById('modalTitle');
const stuNameField = document.getElementById('stuNameField');
const packageSizeField = document.getElementById('packageSizeField');

function toggleEnrollFields(){

document.querySelectorAll('input[name="enrollType"]').forEach(r => r.addEventListener('change', toggleEnrollFields));

document.getElementById('addFab').addEventListener('click', () => openStudentModal(null));
document.getElementById('cancelStudentBtn').addEventListener('click', () => modalBg.classList.remove('show'));

function openStudentModal(id){
  studentForm.reset();
  stuNameField.style.display = 'block';
  document.getElementById('modalMode').value = id ? 'edit' : 'add';
  document.getElementById('enrollmentEditId').value = '';
  toggleEnrollFields();
  if(id){
    const s = students.find(x => x.StudentID === id);
    modalTitle.textContent = 'Edit student';
    document.getElementById('editingId').value = id;
    document.getElementById('enrollmentEditId').value = s.CurrentEnrollmentID || '';
    document.getElementById('stuName').value = s.StudentName;
    document.getElementById('enrollStartDate').value = s.EnrollmentStartDate || '';
    if(s.EnrollmentType){
      document.querySelector(`input[name="enrollType"][value="${s.EnrollmentType}"]`).checked = true;
      if(s.EnrollmentType === 'Package'){
        document.getElementById('packageSize').value = s.PackageSize;
      }
      if(s.EnrollmentType === 'Package' || s.EnrollmentType === 'PackageMoney'){
        document.getElementById('totalAmount').value = s.TotalAmount || '';
        document.getElementById('amountPaid').value = s.AmountPaid || '';
      }
    }
    toggleEnrollFields();
  }else{
    modalTitle.textContent = 'Add student';
    document.getElementById('editingId').value = '';
  }
  modalBg.classList.add('show');
}

function openNewEnrollmentModal(s){
  const current = (s.Enrollments || []).find(e => e.EnrollmentID === s.CurrentEnrollmentID);
  if(current){
    let inProgress = false;
    let detail = '';
    if(current.EnrollmentType === 'Package'){
      const size = Number(current.PackageSize);
      const used = Number(current.SessionsUsed) || 0;
      if(!current.PackageSize || current.PackageSize === 'N/A' || isNaN(size)){
        inProgress = true;
        detail = `${s.StudentName}'s current package has a flexible size, so it's never automatically marked complete.`;
      }else if(used < size){
        inProgress = true;
        detail = `${s.StudentName} still has ${size - used} session${(size-used) === 1 ? '' : 's'} left on their current package (${used}/${size} used).`;
      }
    }else if(current.EnrollmentType === 'PackageMoney'){
      const total = Number(current.TotalAmount) || 0;
      const used = Number(current.AmountUsedTotal) || 0;
      if(total > 0 && used < total){
        inProgress = true;
        detail = `${s.StudentName} still has $${total - used} left on their current money package ($${used}/$${total} used).`;
      }
    }
    if(inProgress){
      const proceed = confirm(
        `${detail}\n\nDo you still want to start a new package/individual sessions for them, or would you rather keep logging against the current one?\n\n` +
        `Click OK to start a new one anyway, or Cancel to go back.`
      );
      if(!proceed) return;
    }
  }

  studentForm.reset();
  stuNameField.style.display = 'none';
  document.getElementById('modalMode').value = 'newEnrollment';
  document.getElementById('editingId').value = s.StudentID;
  document.getElementById('stuName').value = s.StudentName;
  modalTitle.textContent = 'Start new package / sessions for ' + s.StudentName;
  toggleEnrollFields();
  modalBg.classList.add('show');
}

studentForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const mode = document.getElementById('modalMode').value;
  const id = document.getElementById('editingId').value;
  const btn = document.getElementById('saveStudentBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const enrollType = document.querySelector('input[name="enrollType"]:checked').value;
  const isPkg = enrollType === 'Package';
  const isAnyPkg = enrollType === 'Package' || enrollType === 'PackageMoney';
  const enrollmentFields = {
    enrollmentType: enrollType,
    startDate: document.getElementById('enrollStartDate').value || '',
    packageSize: isPkg ? document.getElementById('packageSize').value : '',
    totalAmount: isAnyPkg ? (document.getElementById('totalAmount').value || 0) : '',
    amountPaid: isAnyPkg ? (document.getElementById('amountPaid').value || 0) : ''
  };

  try{
    if(mode === 'add'){
      await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({
        action:'addStudent',
        studentName: document.getElementById('stuName').value.trim(),
        ...enrollmentFields
      })});
    }else if(mode === 'newEnrollment'){
      const s = students.find(x => x.StudentID === id);
      await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({
        action:'addEnrollment',
        studentId: id,
        studentName: s.StudentName,
        ...enrollmentFields
      })});
    }else{
      // edit: rename student, then update their current enrollment's fields
      await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({
        action:'editStudent',
        studentId: id,
        studentName: document.getElementById('stuName').value.trim()
      })});
      const enrollmentId = document.getElementById('enrollmentEditId').value;
      if(enrollmentId){
        await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({
          action:'editEnrollment',
          enrollmentId,
          ...enrollmentFields
        })});
      }
    }
    modalBg.classList.remove('show');
    if(mode === 'newEnrollment'){ selectedEnrollmentId = null; }
    await loadAll();
  }catch(err){
    showMsg(studentMsg, 'Could not save. Try again.', false);
  }finally{
    btn.disabled = false; btn.textContent = 'Save';
  }
});

async function deleteStudent(id){
  const s = students.find(x => x.StudentID === id);
  if(!confirm(`Remove ${s.StudentName} from your active student list? Their past session history will be kept.`)) return;
  try{
    await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({action:'deleteStudent', studentId:id}) });
    await loadAll();
  }catch(err){
    alert('Could not delete. Try again.');
  }
}

// exports
document.getElementById('exportAllBtn').addEventListener('click', () => {
  if(log.length === 0) return;
  const ws = XLSX.utils.json_to_sheet(log);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sessions');
  const wsStu = XLSX.utils.json_to_sheet(students.map(({ShareCode, Enrollments, ...rest}) => rest));
  XLSX.utils.book_append_sheet(wb, wsStu, 'Students');
  const allEnrollments = students.flatMap(s => s.Enrollments || []);
  if(allEnrollments.length){
    const wsEnr = XLSX.utils.json_to_sheet(allEnrollments);
    XLSX.utils.book_append_sheet(wb, wsEnr, 'Enrollments');
  }
  XLSX.writeFile(wb, 'coaching_log_all.xlsx');
});

document.getElementById('exportOneBtn').addEventListener('click', () => {
  const enrollmentIds = (activeStudent.Enrollments || []).map(e => e.EnrollmentID);
  const rows = log.filter(l => enrollmentIds.includes(l.EnrollmentID));
  if(rows.length === 0) return;
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, activeStudent.StudentName.substring(0,30));
  XLSX.writeFile(wb, activeStudent.StudentName.replace(/\s+/g,'_') + '_sessions.xlsx');
});
